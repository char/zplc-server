[package]
name = "zplc-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zplc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
cid = "0.11"
clap = { version = "4", features = ["derive", "env"] }
deadpool-sqlite = "0.13"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_ipld_dagcbor = "0.7"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
